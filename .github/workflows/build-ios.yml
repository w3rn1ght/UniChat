name: Build iOS app (unsigned IPA + DEB)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Toolchain info
        run: |
          xcodebuild -version
          sw_vers

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project UniChat.xcodeproj \
            -target UniChat \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Sign with ldid (for jailbreak)
        run: |
          set -euo pipefail
          APP="build/Release-iphoneos/UniChat.app"
          lipo -info "$APP/UniChat"
          if brew install ldid >/dev/null 2>&1; then
            ldid -S"$PWD/ci/entitlements.plist" "$APP/UniChat" || echo "ldid failed; app stays unsigned"
            echo "Signed with ldid"
          else
            echo "ldid is unavailable; app stays unsigned (AppSync/amfid patch required)"
          fi

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Release-iphoneos/UniChat.app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry UniChat-unsigned.ipa Payload
          ls -lh UniChat-unsigned.ipa

      - name: Package DEB
        run: |
          set -euo pipefail
          APP="build/Release-iphoneos/UniChat.app"

          if ! command -v dpkg-deb >/dev/null 2>&1; then
            brew install dpkg
          fi

          rm -rf pkg
          mkdir -p pkg/Applications pkg/DEBIAN
          cp -R "$APP" pkg/Applications/
          chmod -R 755 pkg/Applications/UniChat.app

          cat > pkg/DEBIAN/control <<'EOF'
          Package: com.unichat.app
          Name: UniChat
          Version: 1.2.1
          Architecture: iphoneos-arm
          Description: AI chat client for iOS 12+ (DeepSeek/Gemini accounts, OpenRouter, AnyModel, APIs)
          Maintainer: UniChat
          Author: UniChat
          Section: Applications
          Priority: optional
          Depends: firmware (>= 12.0)
          EOF

          cat > pkg/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          uicache -a >/dev/null 2>&1 || killall -9 SpringBoard >/dev/null 2>&1
          exit 0
          EOF

          cat > pkg/DEBIAN/postrm <<'EOF'
          #!/bin/sh
          uicache -a >/dev/null 2>&1 || killall -9 SpringBoard >/dev/null 2>&1
          exit 0
          EOF

          chmod 755 pkg/DEBIAN/postinst pkg/DEBIAN/postrm
          dpkg-deb -Zgzip -b pkg UniChat.deb
          ls -lh UniChat.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UniChat-iOS12-unsigned
          path: |
            UniChat-unsigned.ipa
            UniChat.deb
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: UniChat ${{ github.ref_name }}
          files: |
            UniChat-unsigned.ipa
            UniChat.deb
          generate_release_notes: true
